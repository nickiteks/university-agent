services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  security:
    build:
      context: .
      dockerfile: security/Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: university
      KEYCLOAK_CLIENT_ID: university-agent
      KEYCLOAK_TIMEOUT_SECONDS: 5
    ports:
      - "8001:8001"
    depends_on:
      - keycloak

  mcp:
    build:
      context: .
      dockerfile: MCP/Dockerfile
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8003
      MCP_TRANSPORT: http
    ports:
      - "8003:8003"

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      SECURITY_URL: http://security:8001
      MCP_URL: http://mcp:8003/mcp
      LLM_GATEWAY_URL: http://envoy:8080
      LLM_MODEL: qwen
      LLM_TIMEOUT_SECONDS: 60
    ports:
      - "8002:8002"
    depends_on:
      - security
      - mcp
      - envoy

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-cluster", "llm-gateway"]
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - litellm

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      LITELLM_LOG: INFO
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      - vllm

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "Qwen/Qwen2.5-0.5B-Instruct"
      - "--served-model-name"
      - "qwen"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "2048"
    ports:
      - "8000:8000"
    volumes:
      - qwen-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen-cache:
